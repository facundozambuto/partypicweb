<!DOCTYPE html>

<html class="no-js" lang="es"><!--<![endif]-->

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>Party Pic App - Menú de Salones</title>
  <link rel="shortcut icon" href="../images/favicon.png" />
  <link rel="stylesheet" type="text/css" href="../css/bootstrap.css" />
  <link rel="stylesheet" type="text/css" href="../css/style_menu.css" />
  <link rel="stylesheet" type="text/css" href="../css/jquery.bootgrid.min.css" />
  <link rel="stylesheet" type="text/css" href="../admin/css/menusalones.css" />
  <link rel="stylesheet" type="text/css" href="../css/jquery.datetimepicker.css" />
  <link rel="stylesheet" type="text/css" href="http://fonts.googleapis.com/css?family=Oswald">
  <link rel="stylesheet" type="text/css" href="//netdna.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css">

  <script type="text/javascript" src="../js/modernizr.custom.86080.js"></script>
  <script type="text/javascript" src="../js/jquery-1.11.1.min.js"></script>
  <script type="text/javascript" src="../js/moderniz.2.8.1.js"></script>
  <script type="text/javascript" src="../js/bootstrap.min.js"></script>
  <script type="text/javascript" src="../js/modernizr.custom.63321.js"></script>
  <script type="text/javascript" src="../js/jquery.cookie.js"></script>
  <script type="text/javascript" src="../js/jquery.bootgrid.js"></script>
  <script type="text/javascript" src="../js/jquery.bootgrid.fa.js"></script>
  <script type="text/javascript" src="../js/jquery.validate.min.js"></script>
  <script type="text/javascript" src="../js/jquery.datetimepicker.full.js"></script>
  <script type="text/javascript" src="../js/authorizationService.js"></script>
  <script type="text/javascript" src="../js/common.js"></script>
</head>

<body>

  <!-- Page Content -->
  <div id="page-content-wrapper" style="padding-top:40px">
    <div class="container container-ppal" style="margin-top:40px; margin-bottom:40px">
      <div class="row">
        <div class="btn-group btn-breadcrumb pull-left">
          <a href="../admin/dashboard.html" class="btn btn-primary"><i class="glyphicon glyphicon-home"></i></a>
          <a href="../admin/dashboard.html" class="btn btn-primary">Menú Principal</a>
          <a href="../admin/menusalones.html" class="btn btn-primary">Menú Salones</a>
          <!--<a href="#" class="btn btn-primary">Primary</a>-->
        </div>
      </div>
    </div>

    <div class="animationload" id="loadingDivContainer">
      <img src="../images/animacionLogo.gif"
        style="margin: auto; position: absolute; top: 0; left: 0; bottom: 0; right: 0;" alt="partypic" />
    </div>

    <div class="container container-ppal-2">
      <table id="grid-command-buttons" class="table table-condensed table-hover table-striped" data-toggle="bootgrid"
        data-ajax="true" data-url="https://partypic-gyd2dcbgdxd8heaa.brazilsouth-01.azurewebsites.net/api/venues/grid">
        <thead style="border: 2px solid black;">
          <tr>
            <th data-column-id="venueId" data-formatter="IDColumn" data-type="numeric" data-header-css-class="IDColumn"
              data-identifier="true" data-sortable="true">ID</th>
            <th data-column-id="name" data-formatter="nameColumn" data-header-css-class="nameColumn"
              data-sortable="true">Nombre Salón</th>
            <th data-column-id="address" data-formatter="addressColumn" data-header-css-class="addressColumn"
              data-sortable="true">Domicilio</th>
            <th data-column-id="phone" data-formatter="phoneColumn" data-header-css-class="phoneColumn"
              data-sortable="true">Teléfono</th>
            <th data-column-id="userName" data-formatter="userNameColumn" data-header-css-class="userNameColumn"
              data-sortable="true">Encargado</th>
            <th data-column-id="events" data-formatter="eventsColumn" data-header-css-class="eventsColumn"
              data-sortable="true">Ver Eventos</th>
            <th data-column-id="commands" data-formatter="commands" data-header-css-class="CommandColumn"
              data-sortable="false">Opciones</th>
          </tr>
        </thead>
      </table>
    </div>

    <div class="modal fade" role="dialog" aria-labelledby="gridSystemModalLabel3" id="editModal" aria-hidden="true"
      tabindex="-1">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form class="form-horizontal required" action="#" method="post" name="editForm" id="editForm">
            <div class="modal-header">
              <h4 class="modal-title" id="gridSystemModalLabel3">Editar Salón</h4>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <div class="row">
                  <div class="col-xs-12 col-md-12 col-lg-12" style="margin-bottom:20px">
                    <div class="form-group mb-7px">
                      <label for="venueId" class="required col-md-3 control-label">ID</label>
                      <div class="col-md-3">
                        <input id="venueId" disabled="disabled" type="text" class="form-control text-center"
                          name="venueId" placeholder="ID">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="venueNameEdit" class="col-md-3 control-label">Nombre</label>
                      <div class="col-md-9">
                        <input id="venueNameEdit" type="text" class="form-control" name="venueNameEdit"
                          placeholder="Nombre del Salón">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="venueAddressEdit" class="col-md-3 control-label">Domicilio</label>
                      <div class="col-md-9">
                        <input id="venueAddressEdit" type="text" class="form-control" name="venueAddressEdit"
                          placeholder="Domicilio">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="venuePhoneEdit" class="col-md-3 control-label">Teléfono</label>
                      <div class="col-md-6">
                        <input id="venuePhoneEdit" type="text" class="form-control" name="venuePhoneEdit"
                          placeholder="Teléfono">
                      </div>
                    </div>
                    <div id="venueManagerDDLEditContainer" class="form-group mb-7px" style="display: none;">
                      <label for="userIdDDLEdit" class="col-md-3 control-label">Encargado</label>
                      <div class="col-md-6">
                        <select id="userIdDDLEdit" class="form-control" name="userIdDDLEdit">
                        </select>
                      </div>
                    </div>
                  </div>
                  <div id="errorsEditContainer" class="form-group div-errores"></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div id="deleteModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="mySmallModalLabel">Eliminar Salón</h4>
          </div>
          <div class="modal-body">
            &iquest;Estás seguro que deseás eliminar el salón seleccionado?
          </div>
          <div class="modal-footer">
            <button id="btnCancelDelete" type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
            <button id="btnConfirmDelete" type="button" class="btn btn-primary" data-dismiss="modal">Aceptar</button>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div>

    <div class="modal fade" role="dialog" aria-labelledby="gridSystemModalLabel2" id="addingModal" aria-hidden="true"
      tabindex="-1">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form class="form-horizontal required" action="#" method="post" name="addForm" id="addForm">
            <div class="modal-header">
              <h4 class="modal-title" id="gridSystemModalLabel2">Agregar Salón</h4>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <div class="row">
                  <div class="col-xs-12 col-md-12 col-lg-12" style="margin-bottom:20px">
                    <div class="form-group mb-7px">
                      <label for="venueNameAdd" class="col-md-3 control-label">Nombre</label>
                      <div class="col-md-9">
                        <input id="venueNameAdd" type="text" class="form-control" name="venueNameAdd"
                          placeholder="Nombre del Salón">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="venueAddressAdd" class="col-md-3 control-label">Domicilio</label>
                      <div class="col-md-9">
                        <input id="venueAddressAdd" type="text" class="form-control" name="venueAddressAdd"
                          placeholder="Domicilio">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="venuePhoneAdd" class="col-md-3 control-label">Teléfono</label>
                      <div class="col-md-6">
                        <input id="venuePhoneAdd" type="text" class="form-control" name="venuePhoneAdd"
                          placeholder="Teléfono">
                      </div>
                    </div>
                    <div id="venueManagerDDLAddContainer" class="form-group mb-7px" style="display: none;">
                      <label for="userIdDDLAdd" class="col-md-3 control-label">Encargado</label>
                      <div class="col-md-6">
                        <select id="userIdDDLAdd" class="form-control" name="userIdDDLAdd">
                        </select>
                      </div>
                    </div>
                    <div id="errorsAddContainer" class="form-group div-errores"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div class="modal fade" role="dialog" aria-labelledby="gridSystemModalLabel2" id="venueManagerModal"
      aria-hidden="true" tabindex="-1">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="gridSystemModalLabel2">Encargado del Salón</h4>
          </div>
          <div class="modal-body">
            <div class="container-fluid">
              <div class="row">
                <div class="col-xs-12 col-md-12 col-lg-12" style="margin-bottom:20px">
                  <div class="col-md-offset-1 col-lg-offset-1 col-md-10 col-lg-10">
                    <table class="table table-user-information">
                      <tbody>
                        <tr>
                          <td>Encargado/a</td>
                          <td id="venueManagerName"></td>
                        </tr>
                        <tr>
                          <td>E-mail</td>
                          <td><a id="venueManagerEmail" href=""></a></td>
                        </tr>
                        <tr>
                          <td>Celular</td>
                          <td id="venueManagerMobilePhone"></td>
                        </tr>
                        <tr>
                          <td>Teléfono</td>
                          <td id="venueManagerPhone"></td>
                        </tr>
                        <tr>
                          <td>Domicilio</td>
                          <td id="venueManagerAddress"></td>
                        </tr>
                        <tr>
                          <td>CUIL</td>
                          <td id="venueManagerCuil"></td>
                        </tr>
                      </tbody>
                    </table>
                    <a href="../admin/menuusuarios.html" class="btn btn-primary">Editar / Ver Encargados</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-dismiss="modal">Aceptar</button>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->
  </div>
  <!-- /#page-content-wrapper -->
  <script type="text/javascript" src="../admin/js/menusalones.js"></script>
</body>

</html>
