<!DOCTYPE html>

<html class="no-js" lang="es"><!--<![endif]-->

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>Party Pic App - Menú de planes</title>
  <link rel="shortcut icon" href="../images/favicon.png" />
  <link rel="stylesheet" type="text/css" href="../css/bootstrap.css" />
  <link rel="stylesheet" type="text/css" href="../css/style_menu.css" />
  <link rel="stylesheet" type="text/css" href="../css/jquery.bootgrid.min.css" />
  <link rel="stylesheet" type="text/css" href="../admin/css/menuplanes.css" />
  <link rel="stylesheet" type="text/css" href="../css/jquery.datetimepicker.css" />
  <link rel="stylesheet" type="text/css" href="http://fonts.googleapis.com/css?family=Oswald">
  <link rel="stylesheet" type="text/css" href="//netdna.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css">

  <script type="text/javascript" src="../js/modernizr.custom.86080.js"></script>
  <script type="text/javascript" src="../js/jquery-1.11.1.min.js"></script>
  <script type="text/javascript" src="../js/moderniz.2.8.1.js"></script>
  <script type="text/javascript" src="../js/bootstrap.min.js"></script>
  <script type="text/javascript" src="../js/modernizr.custom.63321.js"></script>
  <script type="text/javascript" src="../js/jquery.cookie.js"></script>
  <script type="text/javascript" src="../js/jquery.bootgrid.js"></script>
  <script type="text/javascript" src="../js/jquery.bootgrid.fa.js"></script>
  <script type="text/javascript" src="../js/jquery.validate.min.js"></script>
  <script type="text/javascript" src="../js/authorizationService.js"></script>
  <script type="text/javascript" src="../js/common.js"></script>
</head>

<body>
  
  <!-- Page Content -->
  <div id="page-content-wrapper" style="padding-top:40px">
    <div class="container container-ppal" style="margin-top:40px; margin-bottom:40px">
      <div class="row">
        <div class="btn-group btn-breadcrumb pull-left">
          <a href="../admin/dashboard.html" class="btn btn-primary"><i class="glyphicon glyphicon-home"></i></a>
          <a href="../admin/dashboard.html" class="btn btn-primary">Menú Principal</a>
          <a href="../admin/menuplanes.html" class="btn btn-primary">Menú Planes</a>
          <!--<a href="#" class="btn btn-primary">Primary</a>-->
        </div>
      </div>
    </div>

    <div class="animationload" id="loadingDivContainer">
      <img src="../images/animacionLogo.gif"
        style="margin: auto; position: absolute; top: 0; left: 0; bottom: 0; right: 0;" alt="partypic" />
    </div>

    <div class="container container-ppal-2">
      <table id="grid-command-buttons" class="table table-condensed table-hover table-striped" data-toggle="bootgrid"
        data-ajax="true" data-url="http://local-api.partypic.com/api/planes/grid">
        <thead style="border: 2px solid black;">
          <tr>
            <th data-column-id="planId" data-formatter="IDColumn" data-type="numeric" data-header-css-class="IDColumn"
              data-identifier="true" data-sortable="true">ID</th>
            <th data-column-id="name" data-formatter="nameColumn" data-header-css-class="nameColumn"
              data-sortable="true">Nombre</th>
            <th data-column-id="description" data-formatter="descriptionColumn"
              data-header-css-class="descriptionColumn" data-sortable="true">Descripción</th>
            <th data-column-id="price" data-formatter="priceColumn" data-header-css-class="priceColumn"
              data-sortable="true">Precio</th>
            <th data-column-id="createdDatetime" data-formatter="createdDatetimeColumn"
              data-header-css-class="createdDatetimeColumn" data-sortable="true">Fecha Alta</th>
            <th data-column-id="commands" data-formatter="commands" data-header-css-class="CommandColumn"
              data-sortable="false">Opciones</th>
          </tr>
        </thead>
      </table>
    </div>

    <div class="modal fade" role="dialog" aria-labelledby="gridSystemModalLabel3" id="editModal" aria-hidden="true" tabindex="-1">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form class="form-horizontal required" action="#" method="post" name="editForm" id="editForm">
            <div class="modal-header">
              <h4 class="modal-title" id="gridSystemModalLabel3">Editar Plan</h4>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <div class="row">
                  <div class="col-xs-12 col-md-12 col-lg-12" style="margin-bottom:20px">
                    <div class="form-group mb-7px">
                      <label for="id" class="required col-md-3 control-label">ID</label>
                      <div class="col-md-3">
                        <input id="id" disabled="disabled" type="text" class="form-control text-center" name="id"
                          placeholder="ID">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="planNameEdit" class="col-md-3 control-label">Nombre</label>
                      <div class="col-md-9">
                        <input id="planNameEdit" type="text" class="form-control" name="planNameEdit"
                          placeholder="Nombre del plan">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="planDescriptionEdit" class="col-md-3 control-label">Descripción</label>
                      <div class="col-md-9">
                        <input id="planDescriptionEdit" type="text" class="form-control" name="planDescriptionEdit"
                          placeholder="Descripción del plan">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="planPriceEdit" class="col-md-3 control-label">Precio</label>
                      <div class="col-md-9">
                        <input id="planPriceEdit" type="number" min="0" class="form-control" name="planPriceEdit"
                          placeholder="Precio del plan">
                      </div>
                    </div>
                  </div>
                  <div id="errorsEditContainer" class="form-group div-errores"></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div id="deleteModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="mySmallModalLabel">Eliminar Plan</h4>
          </div>
          <div class="modal-body">
            &iquest;Estás seguro que deseás eliminar el plan seleccionado?
          </div>
          <div class="modal-footer">
            <button id="btnCancelDelete" type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
            <button id="btnConfirmDelete" type="button" class="btn btn-primary" data-dismiss="modal">Aceptar</button>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div>

    <div class="modal fade" role="dialog" aria-labelledby="gridSystemModalLabel2" id="addingModal" aria-hidden="true" tabindex="-1">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <form class="form-horizontal required" action="#" method="post" name="addForm" id="addForm">
            <div class="modal-header">
              <h4 class="modal-title" id="gridSystemModalLabel2">Agregar Plan</h4>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <div class="row">
                  <div class="col-xs-12 col-md-12 col-lg-12" style="margin-bottom:20px">
                    <div class="form-group mb-7px">
                      <label for="planNameAdd" class="col-md-3 control-label">Nombre</label>
                      <div class="col-md-9">
                        <input id="planNameAdd" type="text" class="form-control" name="planNameAdd" placeholder="Nombre del plan">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="planDescriptionAdd" class="col-md-3 control-label">Descripción</label>
                      <div class="col-md-9">
                        <input id="planDescriptionAdd" type="text" class="form-control" name="planDescriptionAdd" placeholder="Descripción del plan">
                      </div>
                    </div>
                    <div class="form-group mb-7px">
                      <label for="planInitialPriceAdd" class="col-md-3 control-label">Precio</label>
                      <div class="col-md-9">
                        <input id="planInitialPriceAdd" type="number" min="0" class="form-control" name="planInitialPriceAdd" placeholder="Precio inicial del plan">
                      </div>
                    </div>
                    <div id="errorsAddContainer" class="form-group div-errores"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div class="modal fade" role="dialog" aria-labelledby="gridSystemModalLabel2" id="historicalPricesModal" aria-hidden="true" tabindex="-1">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <button style="color:red" type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span>×</span>
            </button>
            <h4 style="color:black" class="modal-title" id="priceHistoryTitle"></h4>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div id="modalSuccess" class="modal fade bs-example-modal-lg">
      <div class="modal-dialog modal-lg">
        <div class="modal-content" style="background-color:#dff0d8">
          <div class="modal-header">
            <button style="color:red" type="button" class="close" data-dismiss="modal"
              aria-label="Close"><span>×</span></button>
            <h4 style="color:black" class="modal-title" id="mySmallModalLabel2">OK<a class="anchorjs-link"
                href="#myLargeModalLabel"><span class="anchorjs-icon"></span></a></h4>
          </div>
          <div style="color:black" class="modal-body">
            ¡La acción fue completada con éxito!
          </div>
        </div>
      </div>
    </div>

    <div id="modalError" class="modal fade bs-example-modal-lg">
      <div class="modal-dialog modal-lg">
        <div class="modal-content" style="background-color: #f2dede">
          <div class="modal-header">
            <button style="color:red" type="button" class="close" data-dismiss="modal"
              aria-label="Close"><span>×</span></button>
            <h4 style="color:black" class="modal-title" id="mySmallModalLabel2">Ups!<a class="anchorjs-link"
                href="#myLargeModalLabel"><span class="anchorjs-icon"></span></a></h4>
          </div>
          <div style="color:black" class="modal-body" id="errorMessage">
          </div>
        </div>
      </div>
    </div>

  </div>
  <!-- /#page-content-wrapper -->
  </div>
  <!-- /#wrapper -->
  <script type="text/javascript" src="../admin/js/menuplanes.js"></script>
</body>

</html>
